<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lista de regalos</title>

<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #f9f4f8;
  margin: 0;
  padding: 20px;
}

h2 {
  text-align: center;
  color: #e03eb5;
}

p {
  text-align: center;
  color: #666;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

th, td {
  padding: 12px;
  text-align: left;
}

th {
  background: #e03eb5;
  color: white;
}

tr:nth-child(even) {
  background: #fafafa;
}

button {
  border: none;
  border-radius: 20px;
  padding: 6px 12px;
  cursor: pointer;
  color: white;
  font-size: 13px;
}

.btn-reservar { background: #4caf50; }
.btn-liberar { background: #f44336; }

.btn-regresar {
  display: block;
  margin: 0 auto 15px;
  background: grey;
  padding: 10px 20px;
  border-radius: 25px;
  font-weight: 600;
}

.btn-regresar:hover {
  background: #e03eb5;
}

/* TOAST */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 2000;
}

.toast {
  background: #333;
  color: white;
  padding: 10px 15px;
  border-radius: 8px;
  margin-top: 10px;
  animation: fade 3s forwards;
}

.toast.success { background: #4caf50; }
.toast.error { background: #f44336; }

@keyframes fade {
  0% {opacity:0;}
  10% {opacity:1;}
  90% {opacity:1;}
  100% {opacity:0;}
}

/* LOADING */
#loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(3px);
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 1500;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #ccc;
  border-top: 4px solid #e03eb5;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  justify-content: center;
  align-items: center;
  z-index: 3000;
}

.modal-content {
  background: white;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  max-width: 300px;
  width: 90%;
}

.modal-content h3 {
  color: #e03eb5;
}

.modal-buttons {
  margin-top: 15px;
  display: flex;
  gap: 10px;
  justify-content: center;
}

.modal-buttons button {
  padding: 8px 15px;
  border-radius: 20px;
}

.btn-confirmar { background: #4caf50; }
.btn-cancelar { background: #aaa; }

</style>
</head>
<body>

<button class="btn-regresar" id="btnRegalos">Regresar a invitación</button>

<h2>🎁 Lista de regalos</h2>
<p>Elige un regalo con amor 💖</p>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p>Procesando...</p>
</div>

<table>
  <thead>
    <tr>
      <th>Regalo</th>
      <th>Estado</th>
      <th>Acción</th>
    </tr>
  </thead>
  <tbody id="tabla"></tbody>
</table>

<div class="toast-container" id="toast"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalText"></h3>
    <div class="modal-buttons">
      <button class="btn-confirmar" id="confirmBtn">Sí</button>
      <button class="btn-cancelar" id="cancelBtn">Cancelar</button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbziW4ugHNR0q8w_LCev5dSkr3jJZCraREQGc0RC_xCaEtfgi8URvq1nnvwt-gSmDeS7/exec";

const tabla = document.getElementById("tabla");
const toast = document.getElementById("toast");
const loading = document.getElementById("loading-overlay");

const modal = document.getElementById("modal");
const modalText = document.getElementById("modalText");
const confirmBtn = document.getElementById("confirmBtn");
const cancelBtn = document.getElementById("cancelBtn");

const params = new URLSearchParams(window.location.search);

// 🔥 NORMALIZACIÓN GLOBAL (CLAVE)
const codigo = (params.get("codigo") || "").trim().toUpperCase();

/* VALIDACIÓN */
if (!codigo) {
  alert("Acceso no válido ❌");
  window.location.href = "../index.html";
}

/* TOAST */
function showToast(msg, type="") {
  const div = document.createElement("div");
  div.className = "toast " + type;
  div.textContent = msg;
  toast.appendChild(div);
  setTimeout(()=>div.remove(),3000);
}

/* LOADING */
function showLoading(show){
  loading.style.display = show ? "flex" : "none";
}

/* MODAL */
function openModal(text, onConfirm){
  modalText.textContent = text;
  modal.style.display = "flex";

  confirmBtn.onclick = () => {
    modal.style.display = "none";
    onConfirm();
  };

  cancelBtn.onclick = () => {
    modal.style.display = "none";
  };
}

/* CARGAR */
async function cargar(){
  try {
    showLoading(true);
    const res = await fetch(API_URL);
    const data = await res.json();
    render(data);
  } catch {
    showToast("Error cargando datos","error");
  } finally {
    showLoading(false);
  }
}

/* RENDER */
function render(data){
  tabla.innerHTML = "";

  data.forEach(r=>{
    const reservado = r.estado !== "Disponible";

    const reservadoPor = (r.reservadoPor || "").trim().toUpperCase();

    const esMio = reservadoPor === codigo;

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${r.regalo}</td>
      <td>${reservado ? "🎁 Seleccionado" : "Disponible"}</td>
      <td>
        ${
          !reservado
          ? `<button class="btn-reservar" onclick="reservar(${r.id})">Elegir</button>`
          : esMio
            ? `<button class="btn-liberar" onclick="liberar(${r.id})">Quitar selección</button>`
            : `<span style="color:gray;">Ocupado</span>`
        }
      </td>
    `;

    tabla.appendChild(tr);
  });
}

/* RESERVAR */
function reservar(id){
  fetch(API_URL)
  .then(r=>r.json())
  .then(data=>{
    const regalo = data.find(r=>r.id==id);

    if (!regalo) {
      showToast("Regalo no encontrado","error");
      return;
    }

    if (regalo.estado !== "Disponible") {
      showToast("Este regalo ya fue elegido","error");
      return;
    }

    openModal(`¿Quieres elegir "${regalo.regalo}"?`, async ()=>{
      showLoading(true);

      try {
        await fetch(API_URL,{
          method:"POST",
          body: JSON.stringify({
            id,
            estado:"Tomado",
            reservadoPor: codigo
          })
        });

        showToast("Regalo seleccionado 💖","success");
        cargar();
      } catch {
        showToast("Error al seleccionar","error");
      }
    });
  });
}

/* LIBERAR */
function liberar(id){
  fetch(API_URL)
  .then(r=>r.json())
  .then(data=>{
    const regalo = data.find(r=>r.id==id);

    if (!regalo) {
      showToast("Regalo no encontrado","error");
      return;
    }

    const reservadoPor = (regalo.reservadoPor || "").trim().toUpperCase();

    if (reservadoPor !== codigo) {
      showToast("No puedes liberar este regalo","error");
      return;
    }

    openModal(`¿Deseas liberar "${regalo.regalo}"?`, async ()=>{
      showLoading(true);

      try {
        await fetch(API_URL,{
          method:"POST",
          body: JSON.stringify({
            id,
            estado:"Disponible",
            reservadoPor:""
          })
        });

        showToast("Regalo liberado","success");
        cargar();
      } catch {
        showToast("Error al liberar","error");
      }
    });
  });
}

/* VOLVER */
document.getElementById("btnRegalos").onclick = ()=>{
  window.location.href = "../index.html" + window.location.search;
};

cargar();
</script>

</body>
</html>
